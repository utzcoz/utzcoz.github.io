<aside class="site-nav" id="site-nav" aria-label="Primary navigation">
  <div class="site-nav__inner">
    {%- include brand.html -%}

    <nav class="site-nav__links" aria-label="Sections">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
      {%- if site.feed -%}
        <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
      {%- endif -%}
    </nav>

    {%- if page.layout == 'post' -%}
      <nav class="toc-sidebar" aria-label="Table of contents"></nav>
    {%- endif -%}

    <div class="site-nav__footer">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <p class="site-nav__copyright">&copy; 2018&ndash;{{ 'now' | date: "%Y" }} {{ site.author.name }}. Built with Jekyll.</p>
