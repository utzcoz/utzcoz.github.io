<script>
(function() {
  var toggles = document.querySelectorAll('[data-theme-toggle]');
  if (toggles.length === 0) return;

  function updateIcons() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    for (var i = 0; i < toggles.length; i++) {
      var sun  = toggles[i].querySelector('.icon-sun');
      var moon = toggles[i].querySelector('.icon-moon');
      if (sun)  sun.style.display  = isDark ? 'block' : 'none';
      if (moon) moon.style.display = isDark ? 'none'  : 'block';
      toggles[i].setAttribute('aria-label', label);
      toggles[i].setAttribute('title', label);
    }
  }

  function flipTheme() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var nextDark = !isDark;
    if (nextDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    }
    updateIcons();
    if (typeof window.__rerenderMermaid === 'function') {
      window.__rerenderMermaid(nextDark);
    }
  }

  updateIcons();
  for (var i = 0; i < toggles.length; i++) {
    toggles[i].addEventListener('click', flipTheme);
  }
})();
</script>

<script>
// Article TOC, heading hover anchors, and scrollspy
(function() {
  var tocAside = document.querySelector('.post-toc');
  var sidebar = document.querySelector('.toc-sidebar');
  var mobileDetails = document.querySelector('.toc-mobile');
  var mobile = document.querySelector('.toc-mobile nav');
  var content = document.querySelector('.post-content');
  if (!content) return;

  var headings = content.querySelectorAll('h2, h3');

  for (var i = 0; i < headings.length; i++) {
    if (!headings[i].id) {
      headings[i].id = 'heading-' + i;
    }
  }

  // Build TOC before appending heading anchor icons so labels stay clean.
  if (headings.length >= 2 && (sidebar || mobile)) {
    function buildList() {
      var ol = document.createElement('ol');
      for (var j = 0; j < headings.length; j++) {
        var h = headings[j];
        var li = document.createElement('li');
        if (h.tagName === 'H3') li.className = 'toc-h3';
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent.trim();
        li.appendChild(a);
        ol.appendChild(li);
      }
      return ol;
    }

    if (sidebar) {
      sidebar.innerHTML = '';
      var title = document.createElement('div');
      title.className = 'toc-title';
      title.textContent = 'Contents';
      sidebar.appendChild(title);
      sidebar.appendChild(buildList());
    }
    if (mobile && mobileDetails) {
      mobile.innerHTML = '';
      mobile.appendChild(buildList());
      mobileDetails.classList.add('is-ready');
    }

    var allLinks = document.querySelectorAll('.toc-sidebar a, .toc-mobile nav a');
    var headingMap = {};
    for (var k = 0; k < allLinks.length; k++) {
      var id = allLinks[k].getAttribute('href').slice(1);
      if (!headingMap[id]) headingMap[id] = [];
      headingMap[id].push(allLinks[k]);
    }

    var currentActive = null;
    function setActive(id) {
      if (currentActive === id) return;
      if (currentActive && headingMap[currentActive]) {
        headingMap[currentActive].forEach(function(a) { a.classList.remove('toc-active'); });
      }
      currentActive = id;
      if (id && headingMap[id]) {
        headingMap[id].forEach(function(a) { a.classList.add('toc-active'); });
        if (tocAside && sidebar && tocAside.scrollHeight > tocAside.clientHeight) {
          var sidebarLink = sidebar.querySelector('a.toc-active');
          if (sidebarLink) {
            var asideRect = tocAside.getBoundingClientRect();
            var linkRect = sidebarLink.getBoundingClientRect();
            if (linkRect.top < asideRect.top) {
              tocAside.scrollTop -= (asideRect.top - linkRect.top + 16);
            } else if (linkRect.bottom > asideRect.bottom) {
              tocAside.scrollTop += (linkRect.bottom - asideRect.bottom + 16);
            }
          }
        }
      }
    }

    var scrollTick = false;
    function updateActiveHeading() {
      scrollTick = false;
      var activeId = headings[0].id;
      var nearBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 24);
      if (nearBottom) {
        activeId = headings[headings.length - 1].id;
      } else {
        for (var m = 0; m < headings.length; m++) {
          if (headings[m].getBoundingClientRect().top <= 100) {
            activeId = headings[m].id;
          } else {
            break;
          }
        }
      }
      setActive(activeId);
    }

    window.__updateTocActive = updateActiveHeading;
    window.addEventListener('scroll', function() {
      if (!scrollTick) {
        scrollTick = true;
        requestAnimationFrame(updateActiveHeading);
      }
    }, { passive: true });
    window.addEventListener('resize', updateActiveHeading, { passive: true });
    window.addEventListener('load', updateActiveHeading);
    window.addEventListener('hashchange', updateActiveHeading);
    updateActiveHeading();

    document.addEventListener('click', function(e) {
      var link = e.target.closest('.toc-sidebar a, .toc-mobile nav a');
      if (!link) return;
      e.preventDefault();
      var target = document.getElementById(link.getAttribute('href').slice(1));
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', link.getAttribute('href'));
        if (mobileDetails && link.closest('.toc-mobile')) {
          mobileDetails.removeAttribute('open');
        }
      }
    });
  } else if (tocAside) {
    tocAside.classList.add('is-empty');
  }

  // Subtle hover anchor links on post headings
  if (content.closest('.post')) {
    for (var n = 0; n < headings.length; n++) {
      var anchor = document.createElement('a');
      anchor.className = 'heading-anchor';
      anchor.href = '#' + headings[n].id;
      anchor.setAttribute('aria-label', 'Link to section ' + headings[n].textContent.trim());
      anchor.textContent = '#';
      headings[n].appendChild(anchor);
    }
  }
})();
</script>

<script>
// Convert ```mermaid fenced code blocks to .mermaid divs immediately
// (no mermaid dependency — just DOM manipulation).
// Jekyll renders ```mermaid as <pre><code class="language-mermaid">
(function() {
  var mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
  for (var i = 0; i < mermaidBlocks.length; i++) {
    var code = mermaidBlocks[i];
    var pre = code.parentElement;
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.setAttribute('data-mermaid-src', code.textContent);
    div.textContent = code.textContent;
    pre.parentElement.replaceChild(div, pre);
  }
})();

// Wait for deferred mermaid.js + theme.js to be available.
// Deferred scripts execute after parsing but before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function() {
  function renderMermaid(isDark) {
    if (typeof mermaid === 'undefined' || typeof mermaidWhisper === 'undefined') return;
    var containers = document.querySelectorAll('.mermaid[data-mermaid-src]');
    for (var i = 0; i < containers.length; i++) {
      containers[i].removeAttribute('data-processed');
      containers[i].textContent = containers[i].getAttribute('data-mermaid-src');
    }
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: mermaidWhisper.getTheme(isDark)
    });
    var runResult = mermaid.run();
    if (runResult && typeof runResult.then === 'function') {
      runResult.then(function() {
        if (typeof window.__updateTocActive === 'function') {
          window.__updateTocActive();
        }
      });
    }
  }

  window.__rerenderMermaid = renderMermaid;
  renderMermaid(document.documentElement.getAttribute('data-theme') === 'dark');

  // Mermaid print: strip inline size constraints so SVGs scale to A4.
  var printBackups = [];
  window.addEventListener('beforeprint', function() {
    printBackups = [];
    var containers = document.querySelectorAll('.mermaid');
    for (var i = 0; i < containers.length; i++) {
      var div = containers[i];
      var svg = div.querySelector('svg');
      if (!svg) continue;

      var backup = {
        div: div,
        divStyle: div.getAttribute('style'),
        svg: svg,
        svgStyle: svg.getAttribute('style'),
        svgWidth: svg.getAttribute('width'),
        svgHeight: svg.getAttribute('height')
      };
      printBackups.push(backup);

      if (!svg.getAttribute('viewBox')) {
        var w = svg.width.baseVal.value || svg.getBoundingClientRect().width;
        var h = svg.height.baseVal.value || svg.getBoundingClientRect().height;
        if (w && h) {
          svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
          backup.addedViewBox = true;
        }
      }

      svg.removeAttribute('width');
      svg.removeAttribute('height');
      svg.removeAttribute('style');
      svg.style.width = '100%';
      svg.style.height = 'auto';
      svg.style.maxWidth = 'none';

      div.style.maxWidth = 'none';
      div.style.width = '100%';
      div.style.overflow = 'visible';
    }
  });
  window.addEventListener('afterprint', function() {
    for (var i = 0; i < printBackups.length; i++) {
      var b = printBackups[i];
      b.svg.removeAttribute('style');
      if (b.svgStyle) b.svg.setAttribute('style', b.svgStyle);
      if (b.svgWidth) b.svg.setAttribute('width', b.svgWidth);
      if (b.svgHeight) b.svg.setAttribute('height', b.svgHeight);
      if (b.addedViewBox) b.svg.removeAttribute('viewBox');
      b.div.removeAttribute('style');
      if (b.divStyle) b.div.setAttribute('style', b.divStyle);
    }
    printBackups = [];
  });

  // Mermaid click-to-zoom with pan & scroll-zoom
  function openMermaidZoom(mermaidEl) {
    var overlay = document.createElement('div');
    overlay.className = 'mermaid-zoom-overlay';

    var content = document.createElement('div');
    content.className = 'mermaid-zoom-content';
    content.innerHTML = mermaidEl.innerHTML;

    var closeBtn = document.createElement('button');
    closeBtn.className = 'mermaid-zoom-close';
    closeBtn.innerHTML = '&times;';
    closeBtn.setAttribute('aria-label', 'Close');

    var hint = document.createElement('div');
    hint.className = 'mermaid-zoom-hint';
    var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    hint.textContent = touch
      ? 'Pinch to zoom \u00b7 Drag to pan \u00b7 Tap \u00d7 to close'
      : 'Scroll to zoom \u00b7 Drag to pan \u00b7 Esc to close';

    overlay.appendChild(content);
    overlay.appendChild(closeBtn);
    overlay.appendChild(hint);
    document.body.appendChild(overlay);

    var svg = content.querySelector('svg');
    var origW = 0, origH = 0;
    if (svg) {
      origW = (svg.width && svg.width.baseVal && svg.width.baseVal.value) || 0;
      origH = (svg.height && svg.height.baseVal && svg.height.baseVal.value) || 0;
      if (!origW || !origH) {
        var r = svg.getBoundingClientRect();
        origW = origW || r.width;
        origH = origH || r.height;
      }
      svg.style.maxWidth = 'none';
    }

    var scale = 1;
    if (origW && origH) {
      var fitW = (window.innerWidth * 0.92) / origW;
      var fitH = (window.innerHeight * 0.88) / origH;
      scale = Math.min(fitW, fitH);
      scale = Math.min(Math.max(scale, 0.1), 8);
    }

    var tx = 0, ty = 0;
    var dragging = false;
    var startX, startY, startTx, startTy;
    var rafId = null;

    function applyTransform() {
      content.style.transform = 'translate(' + tx + 'px, ' + ty + 'px)';
      if (svg && origW && origH) {
        svg.style.width = (origW * scale) + 'px';
        svg.style.height = (origH * scale) + 'px';
      }
    }

    function scheduleTransform() {
      if (!rafId) {
        rafId = requestAnimationFrame(function() {
          rafId = null;
          applyTransform();
        });
      }
    }

    applyTransform();

    overlay.addEventListener('wheel', function(e) {
      e.preventDefault();
      var delta = e.deltaY > 0 ? 0.9 : 1.1;
      var newScale = Math.min(Math.max(scale * delta, 0.1), 8);
      var ratio = newScale / scale;
      tx = tx * ratio;
      ty = ty * ratio;
      scale = newScale;
      scheduleTransform();
    }, { passive: false });

    overlay.addEventListener('mousedown', function(e) {
      if (e.target === closeBtn) return;
      e.preventDefault();
      dragging = true;
      overlay.classList.add('is-dragging');
      startX = e.clientX;
      startY = e.clientY;
      startTx = tx;
      startTy = ty;
    });

    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);

    function onMouseMove(e) {
      if (!dragging) return;
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      scheduleTransform();
    }

    function onMouseUp() {
      dragging = false;
      overlay.classList.remove('is-dragging');
    }

    var lastTouchDist = 0;
    overlay.addEventListener('touchstart', function(e) {
      if (e.target === closeBtn) return;
      if (e.touches.length === 1) {
        dragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startTx = tx;
        startTy = ty;
      } else if (e.touches.length === 2) {
        dragging = false;
        lastTouchDist = Math.hypot(
          e.touches[1].clientX - e.touches[0].clientX,
          e.touches[1].clientY - e.touches[0].clientY
        );
      }
    }, { passive: true });

    overlay.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (e.touches.length === 1 && dragging) {
        tx = startTx + (e.touches[0].clientX - startX);
        ty = startTy + (e.touches[0].clientY - startY);
        scheduleTransform();
      } else if (e.touches.length === 2) {
        var dist = Math.hypot(
          e.touches[1].clientX - e.touches[0].clientX,
          e.touches[1].clientY - e.touches[0].clientY
        );
        if (lastTouchDist > 0) {
          scale = Math.min(Math.max(scale * (dist / lastTouchDist), 0.1), 8);
          scheduleTransform();
        }
        lastTouchDist = dist;
      }
    }, { passive: false });

    overlay.addEventListener('touchend', function() {
      dragging = false;
      lastTouchDist = 0;
    });

    function closeOverlay() {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('keydown', onKey);
      if (rafId) cancelAnimationFrame(rafId);
      overlay.remove();
    }

    closeBtn.addEventListener('click', closeOverlay);

    overlay.addEventListener('dblclick', function(e) {
      if (e.target === closeBtn) return;
      scale = 1;
      tx = 0;
      ty = 0;
      scheduleTransform();
    });

    function onKey(e) {
      if (e.key === 'Escape') closeOverlay();
    }
    document.addEventListener('keydown', onKey);
  }

  document.addEventListener('click', function(e) {
    var mermaidEl = e.target.closest('.mermaid');
    if (mermaidEl && !e.target.closest('.mermaid-zoom-overlay')) {
      openMermaidZoom(mermaidEl);
    }
  });
});
</script>

<script>
// Subtle copy button on fenced code blocks
(function() {
  if (!navigator.clipboard) return;
  var blocks = document.querySelectorAll('.post-content .highlight, .post-content > pre');
  for (var i = 0; i < blocks.length; i++) {
    var block = blocks[i];
    if (block.tagName === 'PRE' && block.closest('.highlight')) continue;
    var code = block.querySelector('code') || block;
    var wrap = document.createElement('div');
    wrap.className = 'code-block-wrap';
    block.parentNode.insertBefore(wrap, block);
    wrap.appendChild(block);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy';
    btn.textContent = 'Copy';
    btn.setAttribute('aria-label', 'Copy code');
    (function(targetCode, button) {
      var timer = null;
      button.addEventListener('click', function() {
        navigator.clipboard.writeText(targetCode.textContent).then(function() {
          button.textContent = 'Copied';
          button.classList.add('is-copied');
          clearTimeout(timer);
          timer = setTimeout(function() {
            button.textContent = 'Copy';
            button.classList.remove('is-copied');
          }, 1600);
        });
      });
    })(code, btn);
    wrap.appendChild(btn);
  }
})();
</script>
