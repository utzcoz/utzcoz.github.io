<nav class="mobile-tabbar" aria-label="Mobile navigation">
  <a class="mobile-tabbar__tab" href="{{ '/' | relative_url }}"
     {% if page.url == '/' %}aria-current="page"{% endif %}>
    <svg class="mobile-tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12l9-9 9 9"></path>
      <path d="M5 10v10h14V10"></path>
    </svg>
    <span class="mobile-tabbar__label">Home</span>
  </a>
  <a class="mobile-tabbar__tab" href="{{ '/about/' | relative_url }}"
     {% if page.url == '/about/' %}aria-current="page"{% endif %}>
    <svg class="mobile-tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <line x1="12" y1="11" x2="12" y2="17"></line>
      <circle cx="12" cy="7.5" r="0.6" fill="currentColor"></circle>
    </svg>
    <span class="mobile-tabbar__label">About</span>
  </a>
  <button class="mobile-tabbar__tab" data-theme-toggle aria-label="Toggle theme" type="button">
    <svg class="mobile-tabbar__icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="mobile-tabbar__icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <span class="mobile-tabbar__label">Theme</span>
  </button>
</nav>
